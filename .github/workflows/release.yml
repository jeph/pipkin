name: Release

# Every push to main publishes a signed APK as GitHub release v0.0.N, where N, also the APK's versionCode, is one more
# than the latest release's, and releases the same version on Google Play. A rerun for a commit that already has a
# release reuses its version. The jobs split the work so that each credential is held by as little as possible:
#   build        runs ./gradlew check and builds the unsigned APK and app bundle, with read-only repository access and
#                no secrets, so nothing the build runs, such as Gradle plugins or npm packages, can reach a key
#   sign         signs the APK with the release key from the `release` environment, which only main can deploy to
#   publish      creates the GitHub release with the APK and its R8 mapping, the only job allowed to write to the
#                repository
#   play-sign    signs the bundle with the Play upload key from the `play` environment, which only main can deploy to
#   play-upload  uploads the bundle to Google Play and releases it on the PLAY_TRACK track, the only job allowed to
#                sign in to Google Cloud. It waits for the GitHub release, whose tag takes the version: Play keeping a
#                version code the tag never took would let the next commit reuse it, and Play skip that commit's bundle
#
# Google Play signs the app for users with the same release key as the GitHub APK, so either installs over the other.
#
# The `release` environment holds:
#   secrets    RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD
#   variables  RELEASE_KEY_ALIAS, RELEASE_CERT_SHA256
#
# The `play` environment holds:
#   secrets    PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_UPLOAD_KEYSTORE_PASSWORD
#   variables  PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_CERT_SHA256, PLAY_TRACK, PLAY_WORKLOAD_IDENTITY_PROVIDER,
#              PLAY_SERVICE_ACCOUNT
# play-upload signs in through Workload Identity Federation as PLAY_SERVICE_ACCOUNT, which Google Cloud lets only this
# repository's `play` environment impersonate, so no Google credential is stored in GitHub.

on:
  push:
    branches: [main]

permissions: {}

# Releases run one at a time, in order; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TOOLS_VERSION: 37.0.0

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag, to number this one after the latest.
          fetch-depth: 0
          fetch-tags: true

      - name: Choose version
        id: version
        run: |
          released=$(git tag --points-at HEAD --list 'v0.0.*' | sort -V | tail -n 1)
          if [ -n "$released" ]; then
            code=${released#v0.0.}
          else
            latest=$(git tag --list 'v0.0.*' | sed -n 's/^v0\.0\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
            code=$(( ${latest:-0} + 1 ))
          fi
          echo "Version 0.0.$code"
          echo "VERSION_NAME=0.0.$code" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "name=0.0.$code" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      # Releases start from a clean Gradle home, so a cache written by another branch's run can't reach them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # check covers ktlint, detekt, Android lint, the unit tests and the host's checks; any failure stops the release.
      - name: Check and build
        run: >-
          ./gradlew check :app:assembleRelease :app:bundleRelease
          -Ppipkin.versionName="$VERSION_NAME"
          -Ppipkin.versionCode="$VERSION_CODE"

      # play-upload checks the bundle's version against the one Google Play reads from it.
      - name: Verify APK version
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/pipkin-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/pipkin-unsigned.aab
          gzip -9c app/build/outputs/mapping/release/mapping.txt > "dist/pipkin-v$VERSION_NAME-mapping.txt.gz"
          badging=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging dist/pipkin-unsigned.apk)
          if ! grep -q "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"; then
            echo "The APK doesn't carry version $VERSION_NAME ($VERSION_CODE)" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: dist/pipkin-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-aab
          path: dist/pipkin-unsigned.aab
          if-no-files-found: error
          retention-days: 7

      # R8 renames the release's classes; the mapping turns a stack trace from the GitHub APK back into Pipkin's names.
      # Google Play reads its copy from the app bundle.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping
          path: dist/pipkin-v*-mapping.txt.gz
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/sign-release-apk.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null'

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          mkdir dist
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            scripts/sign-release-apk.sh unsigned/pipkin-unsigned.apk "dist/pipkin-v$VERSION_NAME.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: dist/pipkin-v*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance attestation with Sigstore
      attestations: write # store the attestation
      artifact-metadata: write # link the attestation to the release asset
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mapping
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.apk > SHA256SUMS

      # GitHub only offers build provenance attestations to private repositories on Enterprise plans.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*.apk

      - name: Publish release
        run: |
          if gh release view "v$VERSION_NAME" > /dev/null 2>&1; then
            echo "Release v$VERSION_NAME already exists"
            exit 0
          fi
          gh release create "v$VERSION_NAME" dist/*.apk dist/*-mapping.txt.gz dist/SHA256SUMS \
            --title "Pipkin $VERSION_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest

  play-sign:
    name: Sign for Google Play
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: play
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/sign-play-bundle.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-aab
          path: unsigned

      - name: Sign app bundle
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ vars.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          mkdir dist
          scripts/sign-play-bundle.sh unsigned/pipkin-unsigned.aab "dist/pipkin-v$VERSION_NAME.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-aab
          path: dist/pipkin-v*.aab
          if-no-files-found: error
          retention-days: 7

  play-upload:
    name: Release on Google Play
    needs: [build, play-sign, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: play
    permissions:
      contents: read
      id-token: write # sign in to Google Cloud through Workload Identity Federation
    env:
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
      VERSION_CODE: ${{ needs.build.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/upload-play-bundle.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-aab
          path: dist

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Upload and release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          PLAY_PACKAGE: io.jeph.pipkin
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: scripts/upload-play-bundle.sh "dist/pipkin-v$VERSION_NAME.aab"
